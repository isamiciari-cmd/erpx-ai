name: Validate ERPX
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: node database/build-migrations.mjs --check
      - run: npm install --prefix database/tests --no-audit --no-fund
      - run: node database/tests/transactions.mjs
      - run: node database/tests/business-workflows.mjs
      - run: node database/tests/role-security.mjs
      - run: node database/tests/security-parity.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai/index.ts supabase/functions/zatca/index.ts supabase/functions/manage-users/index.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/security-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-security-failure
          path: .tmp/security-smoke/failure.png
          if-no-files-found: ignore
